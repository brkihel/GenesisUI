<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 128" width="16" height="128">
  <!-- Bar fill v3, white so theme tokens tint it. Soft glass: smooth shading across (no hard
       stripe), a wide faint sheen near the left edge, and depth toward the bottom. Original work. -->
  <defs>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A9A9A"/>
      <stop offset="0.22" stop-color="#F4F4F4"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="0.82" stop-color="#E2E2E2"/>
      <stop offset="1" stop-color="#8C8C8C"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.26"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="16" height="128" fill="url(#h)"/>
  <rect x="1.6" y="0" width="5.2" height="128" fill="url(#sheen)"/>
  <rect x="0" y="0" width="16" height="128" fill="url(#v)"/>
</svg>
