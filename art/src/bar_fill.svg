<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 128" width="16" height="128">
  <!-- Bar fill v2, white so theme tokens tint it: glass across, a little darker toward the
       bottom so the liquid has depth. Original work. -->
  <defs>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A7A7A"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#E4E4E4"/>
      <stop offset="1" stop-color="#626262"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.32"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="16" height="128" fill="url(#h)"/>
  <rect x="0" y="0" width="16" height="128" fill="url(#v)"/>
  <rect x="3.4" y="0" width="1" height="128" fill="#FFFFFF" fill-opacity="0.5"/>
</svg>
